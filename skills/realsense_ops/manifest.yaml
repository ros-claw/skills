schema_version: "hub.asset.v1"

asset:
  type: "skill"
  namespace: "ros-claw"
  name: "realsense_ops"
  version: "1.1.1"
  title: "RealSense Operations Discipline"
  summary: "Lifecycle rules, wedge recovery ladder, freshness gating, and USB/xHCI topology diagnosis for Intel RealSense D400 cameras — keeps pipelines alive for full sessions and never kills the host controller with recovery churn."
  description: |
    Operations companion to the executable capture skill realsense_capture_rgbd.
    Encodes the field-proven discipline: graceful stop only, hardware_reset
    reserved for actual pipe.start failure (-110 UVC wedge), one long-lived
    pipeline per session, freshness gates sized to the collector loop, and a
    fixed recovery escalation ladder (wait+recheck -> restart -> one reset ->
    replug to a different xHCI controller -> PCI rebind/reboot for a dead
    controller).  Ships scripts/realsense_doctor.py for one-shot diagnosis.
  tags:
    - realsense
    - d435i
    - d405
    - usb
    - xhci
    - lifecycle
    - wedge-recovery
    - perception

publisher:
  id: "ros-claw"
  display_name: "ROSClaw Test Team"
  trust_level: "community"
  contact: "https://github.com/ros-claw"

visibility:
  scope: "public"

lifecycle:
  stage: "validated"
  status: "stable"

compatibility:
  rosclaw_min: "1.1.1"
  robots:
    - "realsense_d435i"
    - "realsense_d405"
    - "any_rig_with_d400"

permissions:

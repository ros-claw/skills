schema_version: "rosclaw.eurdf_compat.v1"

compatible_robots:
  - robot: "realsense_d435i"
    eurdf_profile: "ros-claw/realsense_d435i@>=1.0.0"
    body_profile:
      min_dof: 0
      required_limbs: []
      required_sensors:
        - depth_camera
        - color_camera
      optional_sensors:
        - imu
    required_frames: []
    action_interfaces:
      - camera_stream.v1
    physical_limits: {}
    environment_assumptions:
      perception_only: true
  - robot: "realsense_d405"
    eurdf_profile: "ros-claw/realsense_d405@>=1.0.0"
    body_profile:
      min_dof: 0
      required_limbs: []
      required_sensors:
        - depth_camera
        - color_camera
      optional_sensors: []
    required_frames: []
    action_interfaces:
      - camera_stream.v1
    physical_limits: {}
    environment_assumptions:
      perception_only: true
  - robot: "any_rig_with_d400"
    eurdf_profile: "*"
    body_profile:
      min_dof: 0
      required_limbs: []
      required_sensors:
        - depth_camera
      optional_sensors:
        - color_camera
    required_frames: []
    action_interfaces:
      - camera_stream.v1
    physical_limits: {}
    environment_assumptions:
      notes: "This skill manages the camera only; safe alongside actuated bodies as long as interlocks stay camera-independent (prompts/safety.md rule 7)."

incompatible: []
